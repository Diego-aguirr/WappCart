# Development overrides — hot reload, debug ports, verbose logs
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

services:
  db:
    ports:
      - "5433:5432"

  app:
    ports:
      - "3000:3000"
      - "9229:9229"
    environment:
      - NODE_ENV=development
      - COOKIE_SECURE=false
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./prisma:/app/prisma
