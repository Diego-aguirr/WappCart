version: '3.8'
services:
  db:
    image: postgres:16-alpine
    restart: none
    environment:
      POSTGRES_USER: wappcart
      POSTGRES_PASSWORD: wappcart123
      POSTGRES_DB: wappcart
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
